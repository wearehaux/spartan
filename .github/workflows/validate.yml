name: validate

on:
  # Validate code changes into dev and releases into main.
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job name is the status check that the "main protection" ruleset requires on main.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # main only receives releases. Everything else goes through dev.
      - name: Only dev may merge into main
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref != 'dev'
        run: |
          echo "::error::main only receives releases from dev. Open this pull request against dev instead."
          exit 1

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      # The licensed Central Icons package is an optional dependency whose install
      # needs CENTRAL_LICENSE_KEY. CI does not have it, so Storybook uses the plain
      # fallback icon and the Icons panel tests skip themselves.
      - run: pnpm install --frozen-lockfile

      # Figma drift is a separate reconciliation command, not a code CI gate.
      - name: Authored tokens are valid and generated CSS is current
        run: pnpm tokens:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Chromium for the browser tests
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Browser tests
        run: pnpm test:e2e
